<!DOCTYPE html>
<html lang="en">
<head><meta name="color-scheme" content="light"/>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cordell Jones CRM – Multi-City Caller</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#eef2f8;color:#1e293b;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}

/* TOP BAR */
#topbar{background:#1e3a5f;border-bottom:1px solid #16324f;padding:8px 14px;display:flex;align-items:center;gap:12px;flex-shrink:0;min-height:52px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:#0f172a;white-space:nowrap}
.brand svg{color:#ef4444}
.call-count{font-size:11px;font-weight:400;color:#64748b;margin-left:4px}
.nav-controls{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav-btn{background:#f1f5f9;border:1px solid #cbd5e1;color:#1e293b;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:13px;white-space:nowrap}
.nav-btn:hover{background:#cbd5e1}
#biz-jump{width:60px;background:#f1f5f9;border:1px solid #cbd5e1;color:#1e293b;padding:5px 8px;border-radius:6px;font-size:13px;text-align:center}
#biz-jump:focus{outline:none;border-color:#6366f1}
.trackers{display:flex;gap:10px;align-items:center;margin-left:12px}
.tracker{background:#f1f5f9;border:1px solid #cbd5e1;border-radius:6px;padding:4px 10px;font-size:11px;white-space:nowrap;text-align:center}
.tracker-label{color:#64748b;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.tracker-val{color:#1e293b;font-weight:600}
.dot-row{display:flex;gap:3px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:#cbd5e1}
.dot.done{background:#22c55e}
.top-actions{display:flex;gap:8px;margin-left:10px}
.action-btn{background:#f1f5f9;border:1px solid #cbd5e1;color:#1e293b;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;white-space:nowrap;display:flex;align-items:center;gap:5px}
.action-btn:hover{background:#cbd5e1}
.export-btn{background:#059669;border-color:#059669;color:#fff}
.export-btn:hover{background:#047857}

/* FILTER BAR */
#filterbar{background:#eef2f8;border-bottom:1px solid #16324f;padding:4px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:#e2e8f0;border:1px solid #94a3b8;color:#0f172a;padding:2px 10px;border-radius:20px;font-size:11px;cursor:pointer}
.pill.active{background:#6366f1;border-color:#6366f1;color:#fff}
#biz-position{font-size:12px;color:#64748b;white-space:nowrap}

/* PANELS */
#panels{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;flex:1;gap:10px;padding:10px;min-height:0}
.panel{border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.panel-header{padding:9px 14px;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;display:flex;align-items:center;gap:8px;flex-shrink:0}

/* Blue - Business */
#panel-biz{border:2px solid #3b82f6;background:#ffffff;box-shadow:0 0 16px rgba(59,130,246,.18)}
#panel-biz .panel-header{background:linear-gradient(90deg,#1d4ed8,#2563eb);color:#fff}
/* Purple - Script */
#panel-script{border:2px solid #8b5cf6;background:#ffffff;box-shadow:0 0 16px rgba(139,92,246,.18)}
#panel-script .panel-header{background:linear-gradient(90deg,#6d28d9,#7c3aed);color:#fff}
/* Green - Log */
#panel-log{border:2px solid #22c55e;background:#ffffff;box-shadow:0 0 16px rgba(34,197,94,.18)}
#panel-log .panel-header{background:linear-gradient(90deg,#15803d,#16a34a);color:#fff}
/* Orange - Dashboard */
#panel-dash{border:2px solid #f97316;background:#ffffff;box-shadow:0 0 16px rgba(249,115,22,.18)}
#panel-dash .panel-header{background:linear-gradient(90deg,#c2410c,#ea580c);color:#fff}

.panel-body{padding:12px 14px;flex:1;overflow-y:auto;min-height:0}
.panel-body::-webkit-scrollbar{width:4px}
.panel-body::-webkit-scrollbar-track{background:#f1f5f9}
.panel-body::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}

/* BUSINESS PANEL */
#biz-category-badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#64748b;margin-bottom:6px}
#biz-name-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
#biz-name{font-size:22px;font-weight:700;color:#0f172a}
#biz-num-display{font-size:12px;color:#64748b}
#biz-contact-row{font-size:14px;color:#60a5fa;margin-bottom:10px}
#biz-title-row{font-size:12px;color:#64748b;margin-bottom:0;display:none}
.phone-btn{display:flex;align-items:center;justify-content:space-between;background:#dcfce7;border:2px solid #22c55e;border-radius:8px;padding:10px 14px;text-decoration:none;color:#4ade80;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px;transition:background .2s}
.phone-btn:hover{background:#14532d}
.phone-btn .gvoice{font-size:11px;color:#86efac;background:#166534;padding:3px 8px;border-radius:4px}
.no-phone{color:#64748b;font-size:13px;padding:10px 0}
.status-row{margin-top:8px}
.status-row label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#64748b;display:block;margin-bottom:4px}
.status-select{width:100%;background:#f1f5f9;border:1px solid #cbd5e1;color:#1e293b;padding:7px 10px;border-radius:6px;font-size:13px;cursor:pointer}
.status-select:focus{outline:none;border-color:#6366f1}

/* SCRIPT PANEL */
.script-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.stab{background:#f1f5f9;border:1px solid #cbd5e1;color:#64748b;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s}
.stab:hover{background:#cbd5e1;color:#1e293b}
stab.active{background:#7c3aed;border-color:#7c3aed;color:#fff}
